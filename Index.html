<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#0b0b0f">

<link rel="manifest"
      href="https://brokenechoes.github.io/BrokenEchoes6-/manifest.json">

<title>BrokenEchoes6</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:linear-gradient(160deg,#08080c,#151020,#08080c);
  color:white;
  font-family:Arial,sans-serif;
  min-height:100vh;
  padding-bottom:180px;
}

/* HEADER */

.header{
  text-align:center;
  padding:22px 15px 12px;
}

.header h1{
  margin:0;
  font-size:28px;
}

.header p{
  margin:6px 0 0;
  color:#999;
  font-size:13px;
}

/* SEARCH */

.search{
  padding:10px 15px;
}

.search input{
  width:100%;
  padding:14px 17px;
  border:1px solid #ffffff15;
  border-radius:15px;
  outline:none;
  background:#ffffff0d;
  color:white;
  font-size:16px;
}

.search input::placeholder{
  color:#888;
}

/* CATEGORIES */

.categories{
  display:flex;
  gap:9px;
  padding:5px 15px 18px;
  overflow-x:auto;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  flex-shrink:0;
  border:1px solid #ffffff18;
  background:#ffffff0d;
  color:white;
  padding:11px 16px;
  border-radius:22px;
  font-size:14px;
}

.category.active{
  background:linear-gradient(135deg,#ff416c,#7b2cff);
  border-color:transparent;
}

/* SONG LIST */

.song-list{
  padding:0 15px;
}

.song{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  margin-bottom:10px;
  border:1px solid #ffffff0d;
  border-radius:17px;
  background:#ffffff08;
}

.song-icon{
  width:46px;
  height:46px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:13px;
  background:linear-gradient(135deg,#ff416c,#7b2cff);
  font-size:21px;
}

.song-info{
  flex:1;
  min-width:0;
}

.song-info b{
  display:block;
  font-size:15px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.song-info small{
  display:block;
  margin-top:4px;
  color:#888;
  font-size:12px;
}

.song-play{
  width:43px;
  height:43px;
  flex-shrink:0;
  border:0;
  border-radius:50%;
  background:#ffffff12;
  color:white;
  font-size:17px;
}

/* NO SONG */

.no-song{
  text-align:center;
  color:#888;
  padding:40px 10px;
}

/* PLAYER */

.player{
  position:fixed;
  left:10px;
  right:10px;
  bottom:10px;
  z-index:100;
  padding:15px;
  border:1px solid #ffffff18;
  border-radius:24px;
  background:rgba(20,18,28,.97);
  box-shadow:0 10px 40px #0008;
  backdrop-filter:blur(18px);
}

.now-playing{
  text-align:center;
  margin-bottom:8px;
}

.now-playing small{
  color:#777;
  font-size:10px;
}

.now-playing div{
  margin-top:4px;
  font-size:15px;
  font-weight:bold;
}

audio{
  width:100%;
  height:34px;
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:22px;
  margin-top:8px;
}

.controls button{
  width:48px;
  height:48px;
  border:1px solid #ffffff20;
  border-radius:50%;
  background:#ffffff0d;
  color:white;
  font-size:20px;
}

.controls button:active{
  transform:scale(.92);
}

.controls .main-play{
  width:62px;
  height:62px;
  background:linear-gradient(135deg,#ff416c,#7b2cff);
  font-size:25px;
  box-shadow:0 8px 25px #7b2cff55;
}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

  <h1>🎵 BrokenEchoes6</h1>

  <p>My Music • My Stories</p>

</div>


<!-- SEARCH -->

<div class="search">

  <input
    type="text"
    id="searchInput"
    placeholder="🔍 Search song..."
  >

</div>


<!-- CATEGORIES -->

<div class="categories">

  <button
    class="category active"
    data-category="All">
    🎵 All
  </button>

  <button
    class="category"
    data-category="Love">
    ❤️ Love
  </button>

  <button
    class="category"
    data-category="Sad">
    💔 Sad
  </button>

  <button
    class="category"
    data-category="Devotional">
    🕉️ Devotional
  </button>

</div>


<!-- SONG LIST -->

<div
  class="song-list"
  id="songList">
</div>


<!-- PLAYER -->

<div class="player">

  <div class="now-playing">

    <small>NOW PLAYING</small>

    <div id="currentTitle">
      Select a song
    </div>

  </div>


  <audio
    id="audio"
    controls>
  </audio>


  <div class="controls">

    <button id="previousButton">
      ⏮
    </button>

    <button
      class="main-play"
      id="playButton">
      ▶
    </button>

    <button id="nextButton">
      ⏭
    </button>

  </div>

</div>


<script>

/* =========================
   SONGS
========================= */

const songs = [

  {
    title: "Jise Khuda Banaya",
    url: "https://files.catbox.moe/hqh00c.mp3",
    category: "Sad"
  },

  {
    title: "Kahi Dil Na De Baithe",
    url: "https://files.catbox.moe/grz4ya.mp3",
    category: "Love"
  },

  {
    title: "Tu Kyun Gayi",
    url: "https://files.catbox.moe/z0d48f.mp3",
    category: "Sad"
  },

  {
    title: "Tere Ishq Ka Asar",
    url: "https://files.catbox.moe/irx5sz.mp3",
    category: "Love"
  },

  {
    title: "Dard Diya",
    url: "https://files.catbox.moe/i1rrus.mp3",
    category: "Sad"
  }

];


/* =========================
   VARIABLES
========================= */

const audio =
  document.getElementById("audio");

const songList =
  document.getElementById("songList");

const currentTitle =
  document.getElementById("currentTitle");

const playButton =
  document.getElementById("playButton");

const previousButton =
  document.getElementById("previousButton");

const nextButton =
  document.getElementById("nextButton");

const searchInput =
  document.getElementById("searchInput");

const categoryButtons =
  document.querySelectorAll(".category");


let currentIndex = -1;

let currentCategory = "All";


/* =========================
   SHOW SONGS
========================= */

function showSongs(){

  songList.innerHTML = "";

  const searchText =
    searchInput.value
      .toLowerCase()
      .trim();


  const filteredSongs =
    songs.filter(function(song){

      const categoryOK =
        currentCategory === "All" ||
        song.category === currentCategory;

      const searchOK =
        song.title
          .toLowerCase()
          .includes(searchText);

      return categoryOK && searchOK;

    });


  if(filteredSongs.length === 0){

    songList.innerHTML =
      '<div class="no-song">No songs found 🎵</div>';

    return;

  }


  filteredSongs.forEach(function(song){

    const index =
      songs.indexOf(song);


    const div =
      document.createElement("div");


    div.className = "song";


    div.innerHTML = `

      <div class="song-icon">
        🎵
      </div>

      <div class="song-info">

        <b>${song.title}</b>

        <small>
          BrokenEchoes6 • ${song.category}
        </small>

      </div>

      <button
        class="song-play"
        data-index="${index}">
        ▶
      </button>

    `;


    const button =
      div.querySelector(".song-play");


    button.addEventListener(
      "click",
      function(){

        loadSong(index);

      }
    );


    songList.appendChild(div);

  });

}


/* =========================
   LOAD SONG
========================= */

function loadSong(index){

  if(index < 0 || index >= songs.length){
    return;
  }


  currentIndex = index;


  audio.src =
    songs[index].url;


  currentTitle.innerText =
    songs[index].title;


  audio.play()
    .then(function(){

      playButton.innerText = "⏸";

    })
    .catch(function(){

      playButton.innerText = "▶";

    });

}


/* =========================
   PLAY / PAUSE
========================= */

function playPause(){

  if(currentIndex === -1){

    loadSong(0);

    return;

  }


  if(audio.paused){

    audio.play();

  }else{

    audio.pause();

  }

}


/* =========================
   NEXT SONG
========================= */

function nextSong(){

  if(songs.length === 0){
    return;
  }


  currentIndex++;


  if(currentIndex >= songs.length){

    currentIndex = 0;

  }


  loadSong(currentIndex);

}


/* =========================
   PREVIOUS SONG
========================= */

function previousSong(){

  if(songs.length === 0){
    return;
  }


  currentIndex--;


  if(currentIndex < 0){

    currentIndex =
      songs.length - 1;

  }


  loadSong(currentIndex);

}


/* =========================
   AUDIO EVENTS
========================= */

audio.addEventListener(
  "play",
  function(){

    playButton.innerText = "⏸";

  }
);


audio.addEventListener(
  "pause",
  function(){

    playButton.innerText = "▶";

  }
);


audio.addEventListener(
  "ended",
  function(){

    nextSong();

  }
);


/* =========================
   BUTTON EVENTS
========================= */

playButton.addEventListener(
  "click",
  playPause
);


previousButton.addEventListener(
  "click",
  previousSong
);


nextButton.addEventListener(
  "click",
  nextSong
);


/* =========================
   SEARCH
========================= */

searchInput.addEventListener(
  "input",
  showSongs
);


/* =========================
   CATEGORY BUTTONS
========================= */

categoryButtons.forEach(
  function(button){

    button.addEventListener(
      "click",
      function(){

        categoryButtons.forEach(
          function(btn){

            btn.classList.remove("active");

          }
        );


        button.classList.add("active");


        currentCategory =
          button.dataset.category;


        showSongs();

      }
    );

  }
);


/* =========================
   START APP
========================= */

showSongs();

</script>


</body>

</html>
