<body>

<div class="header">
  <h1>🎵 BrokenEchoes6</h1>
  <p>My Music • My Stories</p>
</div>

<div class="now-playing">

  <div class="cover">🎧</div>

  <h2 id="currentTitle">Select a song</h2>
  <p>BrokenEchoes6</p>

  <audio id="audio" controls></audio>

  <div class="controls">
    <button onclick="previousSong()">⏮</button>
    <button class="play" onclick="playPause()">▶</button>
    <button onclick="nextSong()">⏭</button><button onclick="shuffleSong()">🔀</button>
  </div>

</div>
<div class="section-title">
  🎶 All Songs
</div>

<div class="search-box">
  <input
    type="text"
    id="searchInput"
    placeholder="🔍 Search song..."
    onkeyup="searchSongs()"
  >
</div>
  🎶 All Songs
</>

<div id="songList"></div>

<div class="footer">
  © BrokenEchoes6
</div>

<script>

const songs = [

  {
    title:"Jise Khuda Banaya",
    url:"https://files.catbox.moe/hqh00c.mp3"
  },

  {
    title:"Kahi Dil Na De Baithe",
    url:"https://files.catbox.moe/grz4ya.mp3"
  },

  {
    title:"Tu Kyun Gayi",
    url:"https://files.catbox.moe/z0d48f.mp3"
  },

  {
    title:"Tere Ishq Ka Asar",
    url:"https://files.catbox.moe/irx5sz.mp3"
  },

  {
    title:"Dard Diya",
    url:"https://files.catbox.moe/i1rrus.mp3"
  }

];

let currentIndex = 0;

const audio = document.getElementById("audio");
const currentTitle = document.getElementById("currentTitle");
const songList = document.getElementById("songList");

function loadSong(index){

  currentIndex = index;

  audio.src = songs[index].url;

  currentTitle.innerText = songs[index].title;

  audio.play();

}

function playPause(){

  if(!audio.src){
    loadSong(0);
    return;
  }

  if(audio.paused){
    audio.play();
  }else{
    audio.pause();
  }

}

function nextSong(){

  currentIndex++;

  if(currentIndex >= songs.length){
    currentIndex = 0;
  }

  loadSong(currentIndex);

}

function previousSong(){

  currentIndex--;

  if(currentIndex < 0){
    currentIndex = songs.length - 1;
  }

  loadSong(currentIndex);

}

function showSongs(){
function searchSongs(){

  const search =
    document.getElementById("searchInput")
    .value
    .toLowerCase();

  const filtered = songs.filter(song =>
    song.title.toLowerCase().includes(search)
  );

  songList.innerHTML = "";

  filtered.forEach(song => {

    const index = songs.indexOf(song);

    const div = document.createElement("div");

    div.className = "song";

    div.innerHTML = `
      <div class="song-icon">🎵</div>

      <div class="song-info">
        <b>${song.title}</b>
        <small>BrokenEchoes6</small>
      </div>

      <button class="favorite-btn" onclick="toggleFavorite(${index}, this)">♡</button><button class="favorite-btn" onclick="toggleFavorite(${index}, this)">♡</button>
<button onclick="loadSong(${index})">▶</button>
    `;

    songList.appendChild(div);

  });

}
  songList.innerHTML = "";

  songs.forEach((song,index)=>{

    const div = document.createElement("div");

    div.className = "song";

    div.innerHTML = `
      <div class="song-icon">🎵</div>

      <div class="song-info">
        <b>${song.title}</b>
        <small>BrokenEchoes6</small>
      </div>

      <button onclick="loadSong(${index})">▶</button>
    `;

    songList.appendChild(div);

  });

}

audio.addEventListener("ended",nextSong);

showSongs();
function toggleFavorite(index, button){

  if(button.innerText === "♡"){

    button.innerText = "♥";
    button.classList.add("active");

  }else{

    button.innerText = "♡";
    button.classList.remove("active");

  }

}
</script>
